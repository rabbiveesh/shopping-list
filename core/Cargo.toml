[package]
name = "shopping-list-core"
version = "0.1.0"
edition = "2021"
description = "Shopping list rules for Shopping List, compiled to WebAssembly."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Not on crates.io yet: pinned to a commit until it is.
change-graph = { git = "https://github.com/rabbiveesh/change-graph", rev = "e7811b18ac952fbb2aef3198ca5fb545704a2835", features = ["tsify"] }
serde = { version = "1.0.229", features = ["derive"] }
tsify = { version = "0.5.8", features = ["js"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
