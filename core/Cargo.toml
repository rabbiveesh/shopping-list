[package]
name = "shopping-list-core"
version = "0.1.0"
edition = "2021"
description = "Shopping list rules for Shopping List, compiled to WebAssembly."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tsify = { version = "0.5.8", features = ["js"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
